<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="stylesheet" href="_ds/guyana-design-system-c46a8c74-8f2b-4863-94a3-6f22ebb3d937/colors_and_type.css">
<link rel="stylesheet" href="_ds/guyana-design-system-c46a8c74-8f2b-4863-94a3-6f22ebb3d937/styles.css">
<script src="_ds/guyana-design-system-c46a8c74-8f2b-4863-94a3-6f22ebb3d937/_ds_bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="./image-slot.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #ffffff; font-family: Inter, system-ui, sans-serif; }
  a { color: #404293; text-decoration: none; }
  a:hover { color: #323373; }
</style>
</helmet>

<div style="position:absolute; inset:0; max-width:480px; margin:0 auto; background:#ffffff; display:flex; flex-direction:column; overflow:hidden;">

  <div style="position:relative; flex:1; min-height:0; background:rgb(235,239,255); border-radius:0 0 40px 40px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; padding:48px 28px 32px;">

    <div style="flex:none; display:flex; align-items:center; justify-content:center; width:100%; max-width:320px; aspect-ratio:1/1;">
      {{ illustration }}
    </div>

    <div style="display:flex; flex-direction:column; gap:10px; align-items:center; text-align:center; min-height:104px; justify-content:flex-start;">
      <span style="font-size:26px; font-weight:700; line-height:1.2; color:rgb(3,34,65);">{{ title }}</span>
      <span style="font-size:15px; font-weight:400; line-height:1.5; color:rgb(79,100,122); max-width:320px;">{{ body }}</span>
    </div>

    <div style="display:flex; justify-content:center; gap:8px; margin-top:6px;">
      <sc-for list="{{ dots }}" as="d" hint-placeholder-count="3">
        <span style="position:relative; width:{{ d.w }}px; height:6px; border-radius:3px; background:{{ d.bg }}; overflow:hidden;">
          <sc-if value="{{ d.active }}">
            <span style="position:absolute; inset:0; transform-origin:left; transform:scaleX({{ d.progress }}); background:#404293; border-radius:3px; transition:transform 60ms linear;"></span>
          </sc-if>
        </span>
      </sc-for>
    </div>

  </div>

  <div style="flex:none; position:relative; z-index:2; display:flex; flex-direction:column; gap:14px; padding:0px 20px 32px; margin-top:-32px;">
    <span onClick="{{ onNext }}" role="button" style="cursor:pointer; height:56px; width:60%; align-self:center; border-radius:44px; background:#404293; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; color:#ffffff; letter-spacing:0.2px;">
      {{ nextLabel }}
    </span>
    <sc-if value="{{ showSkip }}" hint-placeholder-val="{{ true }}">
      <span onClick="{{ onSkip }}" role="button" style="cursor:pointer; height:44px; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:rgb(79,100,122);">Skip</span>
    </sc-if>
    <sc-if value="{{ !showSkip }}">
      <span style="height:44px;"></span>
    </sc-if>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;onDone&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;() =&gt; void&quot;}}">
const STEPS = [
  { title: 'Simple and intuitive', body: 'View bills, track consumption, and report outages or faults — manage your whole GPL account from your phone.' },
  { title: 'Track your bills and usage', body: 'View your balance, billing history, and consumption trends anytime from your phone.' },
  { title: 'Stay in the know', body: 'Get real-time outage alerts and track service requests from start to finish.' }
];

const ILLUSTRATIONS = [
  // Elegant phone dashboard — the whole account at a glance
  React.createElement('svg', { viewBox: '0 0 260 218', style: { width: '100%', height: '100%', maxWidth: 230 } },
    React.createElement('rect', { x: 68, y: 10, width: 124, height: 198, rx: 22, fill: '#ffffff' }),
    React.createElement('rect', { x: 68, y: 10, width: 124, height: 198, rx: 22, fill: 'none', stroke: 'rgba(64,66,147,0.25)', strokeWidth: 1.5 }),
    React.createElement('rect', { x: 84, y: 30, width: 60, height: 7, rx: 3.5, fill: '#404293', opacity: 0.85 }),
    React.createElement('rect', { x: 84, y: 44, width: 36, height: 5, rx: 2.5, fill: '#404293', opacity: 0.35 }),
    React.createElement('rect', { x: 84, y: 60, width: 92, height: 38, rx: 10, fill: '#404293' }),
    React.createElement('rect', { x: 94, y: 70, width: 44, height: 6, rx: 3, fill: '#ffffff', opacity: 0.9 }),
    React.createElement('rect', { x: 94, y: 82, width: 28, height: 5, rx: 2.5, fill: '#b5c4ff' }),
    React.createElement('path', { d: 'M158 68 L148 82 L155 82 L146 96 L164 78 L156 78 Z', fill: '#f5c84c' }),
    React.createElement('rect', { x: 84, y: 108, width: 42, height: 42, rx: 10, fill: '#ebefff' }),
    React.createElement('rect', { x: 134, y: 108, width: 42, height: 42, rx: 10, fill: '#ebefff' }),
    React.createElement('path', { d: 'M94 136 L100 124 L106 132 L112 118', fill: 'none', stroke: '#404293', strokeWidth: 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' }),
    React.createElement('circle', { cx: 155, cy: 129, r: 11, fill: 'none', stroke: '#404293', strokeWidth: 2.5 }),
    React.createElement('path', { d: 'M155 122 L155 129 L160 132', fill: 'none', stroke: '#404293', strokeWidth: 2.5, strokeLinecap: 'round' }),
    React.createElement('rect', { x: 84, y: 160, width: 92, height: 30, rx: 10, fill: '#ebefff' }),
    React.createElement('rect', { x: 94, y: 170, width: 50, height: 5, rx: 2.5, fill: '#404293', opacity: 0.7 }),
    React.createElement('rect', { x: 94, y: 179, width: 30, height: 4, rx: 2, fill: '#404293', opacity: 0.35 }),
    React.createElement('circle', { cx: 158, cy: 175, r: 7, fill: '#9ef0c0' }),
    React.createElement('circle', { cx: 40, cy: 60, r: 12, fill: 'rgba(64,66,147,0.1)' }),
    React.createElement('circle', { cx: 222, cy: 150, r: 16, fill: 'rgba(64,66,147,0.08)' })
  ),
  // Phone with a bolt — tracking bills and usage
  React.createElement('svg', { viewBox: '0 0 260 218', style: { width: '100%', height: '100%', maxWidth: 220 } },
    React.createElement('rect', { x: 88, y: 24, width: 84, height: 170, rx: 16, fill: '#ffffff' }),
    React.createElement('rect', { x: 88, y: 24, width: 84, height: 170, rx: 16, fill: 'none', stroke: 'rgba(64,66,147,0.25)', strokeWidth: 1.5 }),
    React.createElement('rect', { x: 98, y: 42, width: 64, height: 120, rx: 4, fill: '#404293' }),
    React.createElement('circle', { cx: 130, cy: 182, r: 5, fill: '#404293' }),
    React.createElement('path', { d: 'M138 60 L118 100 L132 100 L120 142 L158 92 L140 92 Z', fill: '#f5c84c' }),
    React.createElement('rect', { x: 30, y: 150, width: 46, height: 32, rx: 6, fill: '#ebefff' }),
    React.createElement('rect', { x: 184, y: 120, width: 46, height: 32, rx: 6, fill: '#ebefff' }),
    React.createElement('path', { d: 'M53 150 V130 M53 130 C 53 120, 63 120, 63 130', fill: 'none', stroke: '#404293', strokeWidth: 3, strokeLinecap: 'round' }),
    React.createElement('circle', { cx: 44, cy: 70, r: 10, fill: 'rgba(64,66,147,0.1)' }),
    React.createElement('circle', { cx: 210, cy: 60, r: 14, fill: 'rgba(64,66,147,0.08)' })
  ),
  // Bell with alert waves — outage alerts
  React.createElement('svg', { viewBox: '0 0 260 218', style: { width: '100%', height: '100%', maxWidth: 200 } },
    React.createElement('path', { d: 'M130 36 C 100 36, 90 62, 90 92 L90 128 L72 156 L188 156 L170 128 L170 92 C 170 62, 160 36, 130 36 Z', fill: '#404293' }),
    React.createElement('rect', { x: 114, y: 160, width: 32, height: 16, rx: 8, fill: '#404293' }),
    React.createElement('path', { d: 'M136 70 L120 100 L132 100 L118 132 L150 94 L136 94 Z', fill: '#f5c84c' }),
    React.createElement('path', { d: 'M40 110 C 55 90, 55 130, 70 110', fill: 'none', stroke: '#9ef0c0', strokeWidth: 3, strokeLinecap: 'round' }),
    React.createElement('path', { d: 'M190 110 C 205 90, 205 130, 220 110', fill: 'none', stroke: '#9ef0c0', strokeWidth: 3, strokeLinecap: 'round' }),
    React.createElement('circle', { cx: 130, cy: 36, r: 6, fill: '#9ef0c0' })
  )
];

const STEP_MS = 3200;

class Component extends DCLogic {
  state = { step: 0, progress: 0 };

  componentDidMount() {
    this.startTimer();
  }

  componentWillUnmount() {
    this.clearTimer();
  }

  clearTimer() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
  }

  startTimer() {
    this.clearTimer();
    this.startedAt = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - this.startedAt) / STEP_MS);
      this.setState({ progress: p });
      if (p >= 1) {
        this.advance();
      } else {
        this.raf = requestAnimationFrame(tick);
      }
    };
    this.raf = requestAnimationFrame(tick);
  }

  advance() {
    const last = this.state.step === STEPS.length - 1;
    if (last) {
      this.clearTimer();
      this.finish();
    } else {
      this.setState({ step: this.state.step + 1, progress: 0 }, () => this.startTimer());
    }
  }

  goTo(idx) {
    this.setState({ step: idx, progress: 0 }, () => this.startTimer());
  }

  finish() {
    if (this.props.onDone) this.props.onDone();
  }

  renderVals() {
    const i = this.state.step;
    const last = i === STEPS.length - 1;
    const step = STEPS[i];
    return {
      step: i,
      title: step.title,
      body: step.body,
      illustration: ILLUSTRATIONS[i],
      nextLabel: last ? 'Get started' : 'Next',
      onNext: () => { if (last) this.finish(); else this.goTo(i + 1); },
      showSkip: !last,
      onSkip: () => this.finish(),
      dots: STEPS.map((_, idx) => ({
        w: idx === i ? 24 : 16,
        active: idx === i,
        progress: idx === i ? this.state.progress : (idx < i ? 1 : 0),
        bg: idx <= i ? 'rgb(181,196,255)' : 'rgb(218,224,255)'
      }))
    };
  }
}

</script>
</body>
</html>
