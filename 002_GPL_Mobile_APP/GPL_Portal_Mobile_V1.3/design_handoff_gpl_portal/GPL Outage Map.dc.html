<helmet>
<link rel="stylesheet" href="../assets/leaflet/leaflet.css">

<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="_ds/guyana-design-system-c46a8c74-8f2b-4863-94a3-6f22ebb3d937/colors_and_type.css">
<style>
  html, body { height:100%; }
  body { --agency-accent:#404293; --agency-accent-strong:#323373; --agency-accent-soft:rgba(64,66,147,0.12); --agency-contrast:#ffffff; }
  a { color:#404293; text-decoration:none; }
  a:hover { color:#323373; }
  .pin { display:flex; align-items:center; justify-content:center; border-radius:999px; color:#fff; font-weight:700; font-size:12.5px; border:2.5px solid #fff; box-shadow:0 3px 10px rgba(19,28,46,0.34); transition:transform 180ms cubic-bezier(0.2,0.8,0.3,1), box-shadow 180ms cubic-bezier(0.2,0.8,0.3,1), opacity 180ms ease; cursor:pointer; }
  .pin.unplanned { background:#be2a34; }
  .pin.planned { background:#c47d12; }
  .pin.restored { background:#0e8d8a; }

  .pin.active.mine { box-shadow:0 0 0 6px rgba(64,66,147,0.38), 0 6px 16px rgba(19,28,46,0.4); }
  .map-has-selection .pin:not(.active) { opacity:0.55; }
  .leaflet-marker-icon:has(.pin.active) { z-index:1000 !important; }
  .place-label { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:#4b5568; white-space:nowrap; text-shadow:0 1px 0 #fff, 0 0 4px #fff, 0 0 8px #fff; }
  .place-label i { width:7px; height:7px; border-radius:999px; background:#7a8599; border:1.5px solid #fff; flex:none; }
  .place-label.cap { font-weight:700; color:#131c2e; font-size:12.5px; }
  .place-label.cap i { background:#131c2e; }
  #gplmap-map.leaflet-container { background:#aad3df; }
  .city-label { display:block; transform:translate(-50%,-50%); font-size:12px; font-weight:600; color:#5f6368; white-space:nowrap; text-shadow:0 0 3px #fff, 0 0 6px #fff; }
  .city-label.big { font-size:13px; font-weight:800; letter-spacing:0.16em; color:#3c4043; }

  .city-label.park { color:#2e7d32; font-size:11px; }
  .street-label { display:block; font-size:10.5px; font-weight:500; color:#333; white-space:nowrap; text-shadow:0 0 3px #fff, 0 0 5px #fff; }
  .region-label { display:block; transform:translate(-50%,-50%); font-size:10.5px; font-weight:600; font-style:italic; letter-spacing:0.04em; color:rgba(46,74,38,0.7); white-space:nowrap; text-shadow:0 0 4px rgba(255,255,255,0.8); }
  .zone-label { font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:rgba(19,28,46,0.42); white-space:nowrap; text-shadow:0 1px 0 #fff, 0 0 6px #fff; }
  .gplmap-btn { cursor:pointer; border:0; font-family:inherit; display:inline-flex; align-items:center; gap:7px; height:38px; padding:0 15px; border-radius:999px; font-size:13.5px; font-weight:600; transition:background 160ms ease, color 160ms ease, border-color 160ms ease; }
  .gplmap-btn-primary { background:var(--agency-accent); color:#fff; }
  .gplmap-btn-primary:hover { background:var(--agency-accent-strong); }
  .gplmap-btn-ghost { background:#fff; color:var(--fg-2); border:1px solid rgba(19,28,46,0.16); }
  .gplmap-btn-ghost:hover { border-color:var(--agency-accent); color:var(--agency-accent); }
  #gplmap-panel { position:absolute; left:0; right:0; bottom:0; z-index:1000; background:#fff; border-top:1px solid rgba(19,28,46,0.12); box-shadow:0 -10px 30px rgba(19,28,46,0.16); border-radius:18px 18px 0 0; padding:18px 20px calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateY(105%); transition:transform 260ms cubic-bezier(0.2,0.8,0.3,1); max-height:62%; overflow:auto; }
  #gplmap-panel.open { transform:translateY(0); }
  .gplmap-strip { display:flex; align-items:flex-start; gap:0; }
  .gplmap-strip-step { flex:1; min-width:0; display:flex; flex-direction:column; gap:7px; }
  .gplmap-strip-bar { height:5px; border-radius:999px; }
  .gplmap-strip-label { font-size:11px; font-weight:700; line-height:1.3; }
  .gplmap-fact { flex:1 1 130px; min-width:0; background:var(--surface-2,#f4f7fb); border-radius:12px; padding:11px 13px; display:flex; flex-direction:column; gap:3px; }
  .gplmap-fact-k { font-size:11.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--fg-3); }
  .gplmap-fact-v { font-size:15px; font-weight:700; color:var(--fg-1); margin-top:3px; }
  .gplmap-legend-dot { width:12px; height:12px; border-radius:999px; border:2px solid #fff; box-shadow:0 1px 3px rgba(19,28,46,0.3); flex:none; }
  @media (max-width: 560px) {
    .gplmap-legend, .gplmap-stamp { display:none; }
  }
</style>
</helmet>

<div style="height:100vh; max-width:480px; margin:0 auto; display:flex; flex-direction:column; overflow:hidden; font-family:Inter, system-ui, sans-serif; background:#eef2f8; color:var(--fg-1);">

  <header style="flex:none; background:#fff; border-bottom:1px solid rgba(19,28,46,0.10); padding:8px clamp(14px,3vw,22px); display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; justify-content:space-between;">
    <div style="display:flex; align-items:center; gap:10px; min-width:0; flex:1 1 auto;">
      <span onClick="{{ onBack }}" role="button" tabIndex="{{ zero }}" aria-label="Back" style="position:relative; flex:none; width:30px; height:30px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; color:var(--fg-2); cursor:pointer;" style-before="content:'';position:absolute;top:50%;left:50%;width:44px;height:44px;transform:translate(-50%,-50%);"><i data-lucide="chevron-left" style="width:20px;height:20px"></i></span>
      <div style="min-width:0;">
        <h1 style="font-size:15.5px; font-weight:700; letter-spacing:-0.01em;">{{ headingText }}</h1>
        <p id="gplmap-stamp" class="gplmap-stamp" style="font-size:11px; color:var(--fg-3); margin-top:1px;">Loading outages…</p>
      </div>
    </div>
    <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center; flex:0 0 auto;">
      <span class="gplmap-legend" style="display:flex; align-items:center; gap:8px; padding:6px 12px 6px 10px; border-radius:999px; background:var(--surface-2,#f4f7fb);">
        <span class="gplmap-legend-dot" style="background:#be2a34;"></span><span style="font-size:12.5px; font-weight:600; color:var(--fg-2);">Unplanned</span>
        <span class="gplmap-legend-dot" style="background:#c47d12; margin-left:6px;"></span><span style="font-size:12.5px; font-weight:600; color:var(--fg-2);">Planned</span>
        <span class="gplmap-legend-dot" style="background:#0e8d8a; margin-left:6px;"></span><span style="font-size:12.5px; font-weight:600; color:var(--fg-2);">Restored</span>
      </span>
      <button id="gplmap-scope" class="gplmap-btn gplmap-btn-primary" type="button" aria-label="View all Guyana outages" title="View all Guyana outages" style="width:34px; height:34px; padding:0; justify-content:center; border-radius:999px;"><i data-lucide="map-pin" style="width:17px;height:17px"></i></button>
    </div>
  </header>

  <div style="position:relative; flex:1; min-height:0; display:flex;">
    <div id="gplmap-map" style="flex:1; min-height:0; background:#aad3df;"></div>

    <div style="position:absolute; top:12px; left:12px; z-index:1000; background:#fff; border:1px solid rgba(19,28,46,0.12); border-radius:14px; box-shadow:0 4px 14px rgba(19,28,46,0.12); padding:12px 14px; display:flex; gap:16px;">
      <span style="display:flex; flex-direction:column; gap:2px;">
        <span class="gplmap-fact-k">Active outages</span>
        <span id="gplmap-count-active" class="gplmap-fact-v">—</span>
      </span>
      <span style="display:flex; flex-direction:column; gap:2px;">
        <span class="gplmap-fact-k">Customers affected</span>
        <span id="gplmap-count-cust" class="gplmap-fact-v">—</span>
      </span>
    </div>

    <div id="gplmap-panel">
      <div style="display:flex; align-items:flex-start; gap:12px;">
        <div style="flex:1; min-width:0;">
          <div id="gplmap-p-eyebrow" style="font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--fg-4);"></div>
          <h2 id="gplmap-p-title" style="font-size:17px; font-weight:700; letter-spacing:-0.01em; margin-top:3px;"></h2>
          <p id="gplmap-p-zone" style="font-size:13px; color:var(--fg-3); margin-top:3px;"></p>
        </div>
        <button id="gplmap-p-close" class="gplmap-btn gplmap-btn-ghost" type="button" aria-label="Close" style="flex:none; width:36px; height:36px; padding:0; justify-content:center; border-radius:11px;">✕</button>
      </div>
      <div class="gplmap-strip" id="gplmap-p-strip" style="margin-top:18px;"></div>
      <div style="display:flex; flex-wrap:wrap; gap:9px; margin-top:16px;">
        <span class="gplmap-fact"><span class="gplmap-fact-k">Customers affected</span><span id="gplmap-p-cust" class="gplmap-fact-v"></span></span>
        <span class="gplmap-fact"><span class="gplmap-fact-k">Estimated restoration</span><span id="gplmap-p-eta" class="gplmap-fact-v"></span></span>
      </div>
      <p id="gplmap-p-detail" style="font-size:13.5px; line-height:1.6; color:var(--fg-2); margin-top:14px;"></p>
      <p id="gplmap-p-note" style="font-size:12px; line-height:1.55; color:var(--fg-4); margin-top:12px;"></p>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const OUTAGES = [
  { ref: 'OUT-4903', kind: 'unplanned', mine: true, title: 'Sheriff Street and Lamaha Street',
    place: 'Georgetown', zone: 'Demerara', feeder: 'Feeder GT-04', lat: 6.8013, lon: -58.1551,
    stage: 2, customers: 1420, eta: '18:00 to 20:00 today', reports: 12,
    detail: 'A transmission and distribution crew is on site. The fault is on the 13.8 kV feeder serving the area.' },
  { ref: 'OUT-4897', kind: 'unplanned', title: 'Republic Avenue', place: 'Linden', zone: 'Demerara',
    feeder: 'Feeder LN-02', lat: 6.0000, lon: -58.3000, stage: 1, customers: 640,
    eta: 'Not yet set', detail: 'Reported by customers and confirmed by the control room. A crew is being assigned.' },
  { ref: 'OUT-4884', kind: 'unplanned', title: 'Corentyne Coast road', place: 'Corriverton', zone: 'Berbice',
    feeder: 'Feeder BC-07', lat: 5.8900, lon: -57.1600, stage: 3, customers: 310,
    eta: 'Within the hour', detail: 'A fallen pole has been replaced and the crew is energising the line section by section.' },
  { ref: 'OUT-4870', kind: 'planned', title: 'Feeder replacement', place: 'Diamond Housing Scheme', zone: 'Demerara',
    feeder: 'Feeder DM-11', lat: 6.6667, lon: -58.2333, stage: 0, customers: 2100,
    eta: '09:00 to 14:00 on 14 August', detail: 'Planned interruption while a feeder on the Diamond line is replaced. Scheduled and notified in advance.' },
  { ref: 'OUT-4866', kind: 'planned', title: 'Substation maintenance', place: 'Anna Regina', zone: 'Essequibo',
    feeder: 'Feeder EQ-03', lat: 7.2650, lon: -58.5070, stage: 0, customers: 870,
    eta: '08:00 to 12:00 on 16 August', detail: 'Planned maintenance at the Anna Regina substation.' },
  { ref: 'OUT-4855', kind: 'restored', title: 'Main Street', place: 'New Amsterdam', zone: 'Berbice',
    feeder: 'Feeder BC-02', lat: 6.2470, lon: -57.5205, stage: 4, customers: 0,
    eta: 'Restored 22:15 yesterday', detail: 'Supply was interrupted and restored the same evening.' },
  { ref: 'OUT-4849', kind: 'restored', title: 'Bartica landing', place: 'Bartica', zone: 'Essequibo',
    feeder: 'Feeder EQ-08', lat: 6.4000, lon: -58.6167, stage: 4, customers: 0,
    eta: 'Restored 14:40 yesterday', detail: 'A damaged service line was repaired and supply restored.' }
];
const STAGES = ['Reported', 'Crew assigned', 'In progress', 'Restored'];
const PLANNED_STAGES = ['Scheduled', 'Crew assigned', 'In progress', 'Completed'];
const TONE = { unplanned: '#be2a34', planned: '#c47d12', restored: '#0e8d8a' };
const BASEMAP_URL = '../assets/guyana-basemap.json';
const CITY_MAP = {
  src: '../assets/georgetown-map.svg',
  bounds: [[6.745, -58.215], [6.835, -58.075]],
  streets: [
    { t: 'Sheriff St', lat: 6.785, lon: -58.1551, rot: -90 },
    { t: 'Lamaha St', lat: 6.8019, lon: -58.122, rot: 0 },
    { t: 'Vlissengen Rd', lat: 6.775, lon: -58.161, rot: -88 },
    { t: 'Rupert Craig Hwy', lat: 6.8096, lon: -58.110, rot: 0 },
    { t: 'East Coast Public Rd', lat: 6.8197, lon: -58.098, rot: 1 },
    { t: 'Mandela Ave', lat: 6.775, lon: -58.1342, rot: -84 },
    { t: 'East Bank Public Rd', lat: 6.765, lon: -58.1655, rot: -88 }
  ],
  areas: [
    { t: 'GEORGETOWN', lat: 6.8185, lon: -58.150 },
    { t: 'Kitty', lat: 6.8135, lon: -58.1435 },
    { t: 'Campbellville', lat: 6.795, lon: -58.143 },
    { t: 'Bel Air', lat: 6.787, lon: -58.105 },
    { t: 'Albouystown', lat: 6.783, lon: -58.150 },
    { t: 'Ruimveldt', lat: 6.759, lon: -58.147 },
    { t: 'Vreed-en-Hoop', lat: 6.805, lon: -58.200 },
    { t: 'Demerara River', lat: 6.785, lon: -58.174, water: 1 },
    { t: 'Atlantic Ocean', lat: 6.830, lon: -58.120, water: 1 },
    { t: 'Botanical Gardens', lat: 6.8055, lon: -58.133, park: 1 }
  ]
};
const ESSEQUIBO_MOUTH =-58.60, BERBICE_MOUTH = -57.55;
const ZONES = [
  { name: 'Essequibo', min: -180, max: ESSEQUIBO_MOUTH, at: [6.9, -58.95] },
  { name: 'Demerara', min: ESSEQUIBO_MOUTH, max: BERBICE_MOUTH, at: [6.55, -58.05] },
  { name: 'Berbice', min: BERBICE_MOUTH, max: 180, at: [6.05, -57.25] }
];

function clipHalf(ring, lon, keepLeft) {
  const out = [];
  const inside = p => keepLeft ? p[0] <= lon : p[0] >= lon;
  for (let i = 0; i < ring.length; i++) {
    const a = ring[i], b = ring[(i + 1) % ring.length];
    const ia = inside(a), ib = inside(b);
    if (ia) out.push(a);
    if (ia !== ib) {
      const t = (lon - a[0]) / (b[0] - a[0]);
      out.push([lon, a[1] + t * (b[1] - a[1])]);
    }
  }
  return out;
}

class Component extends DCLogic {
  componentDidMount() {
    if (this.booted) return;
    this.booted = true;
    const L = window.L;
    if (!L) { setTimeout(() => { this.booted = false; this.componentDidMount(); }, 150); return; }
    if (window.lucide) { try { window.lucide.createIcons(); } catch (e) {} }

    // Basemap is drawn from a bundled file (Natural Earth, public domain) rather
    // than remote map tiles, which the published page cannot load.
    const map = L.map('gplmap-map', { zoomControl: true, attributionControl: true, minZoom: 6, maxZoom: 16 });
    this.map = map;
    map.attributionControl.setPrefix(false);
    map.attributionControl.addAttribution('Basemap: Natural Earth · Street map illustrative');
    map.createPane('gplBase'); map.getPane('gplBase').style.zIndex = 250;
    map.createPane('gplCity'); map.getPane('gplCity').style.zIndex = 300;
    map.createPane('gplLabels'); map.getPane('gplLabels').style.zIndex = 450; map.getPane('gplLabels').style.pointerEvents = 'none';

    const MINE = OUTAGES.find(o => o.mine) || OUTAGES[0];
    const LOCAL_ZOOM = 13;
    const NATIONAL_BOUNDS = () => L.latLngBounds(OUTAGES.map(o => [o.lat, o.lon])).pad(0.55);
    let national = new URLSearchParams(location.search).get('scope') === 'all';
    const showLocal = () => map.setView([MINE.lat, MINE.lon], LOCAL_ZOOM);
    if (national) map.fitBounds(NATIONAL_BOUNDS()); else showLocal();

    const zoneLayer = L.layerGroup().addTo(map);
    const placeLayer = L.layerGroup().addTo(map);
    const regionLabelLayer = L.layerGroup();
    const syncRegionLabels = () => { regionLabelLayer.remove(); };
    map.on('zoomend', syncRegionLabels); setTimeout(syncRegionLabels, 0);
    const cityLabelLayer = L.layerGroup(), streetLabelLayer = L.layerGroup();
    function syncCityLabels() {
      const z = map.getZoom();
      if (z >= 12) cityLabelLayer.addTo(map); else cityLabelLayer.remove();
      if (z >= 14) streetLabelLayer.addTo(map); else streetLabelLayer.remove();
    }
    map.on('zoomend', syncCityLabels);
    const basemapUrl = BASEMAP_URL;
    {
      fetch(basemapUrl).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(base => {
        // Styled after the OpenStreetMap standard map used in the original design.
        const gyGeom = base.countries.filter(f => f.properties.gy);
        L.geoJSON({ type: 'FeatureCollection', features: base.countries.filter(f => !f.properties.gy) }, {
          pane: 'gplBase', interactive: false,
          style: { stroke: false, fillColor: '#f2efe9', fillOpacity: 1 }
        }).addTo(map);
        L.geoJSON({ type: 'FeatureCollection', features: gyGeom }, {
          pane: 'gplBase', interactive: false,
          style: { stroke: false, fillColor: '#f2efe9', fillOpacity: 1 }
        }).addTo(map);
        L.geoJSON({ type: 'FeatureCollection', features: (base.regions || []).filter(f => !/Demerara-Mahaica|Essequibo Islands|Mahaica-Berbice|East Berbice|Pomeroon/.test(f.properties.name)) }, {
          pane: 'gplBase', interactive: false,
          style: { stroke: false, fillColor: '#add19e', fillOpacity: 0.85 }
        }).addTo(map);
        L.geoJSON({ type: 'FeatureCollection', features: base.regions || [] }, {
          pane: 'gplBase', interactive: false,
          style: { color: '#a58cab', weight: 1, opacity: 0.7, dashArray: '5 4', fill: false }
        }).addTo(map);
        L.geoJSON({ type: 'FeatureCollection', features: base.countries }, {
          pane: 'gplBase', interactive: false,
          style: { color: '#9e84a6', weight: 2.4, opacity: 0.75, dashArray: '9 4 2 4', fill: false }
        }).addTo(map);
        L.geoJSON({ type: 'FeatureCollection', features: base.urban || [] }, {
          pane: 'gplBase', interactive: false,
          style: { stroke: false, fillColor: '#e0dfdf', fillOpacity: 1 }
        }).addTo(map);
        L.geoJSON({ type: 'FeatureCollection', features: base.rivers }, {
          pane: 'gplBase', interactive: false,
          style: f => ({ color: '#aad3df', weight: (f.properties.rank || 9) <= 5 ? 4 : 2.5, opacity: 1, lineCap: 'round', lineJoin: 'round' })
        }).addTo(map);
        const roadFc = { type: 'FeatureCollection', features: base.roads };
        L.geoJSON(roadFc, { pane: 'gplBase', interactive: false,
          style: f => ({ color: (f.properties.rank || 9) <= 6 ? '#c9a46a' : '#bcbcbc', weight: (f.properties.rank || 9) <= 6 ? 4.5 : 3.2, opacity: 1, lineCap: 'round', lineJoin: 'round' }) }).addTo(map);
        L.geoJSON(roadFc, { pane: 'gplBase', interactive: false,
          style: f => ({ color: (f.properties.rank || 9) <= 6 ? '#fcd6a4' : '#ffffff', weight: (f.properties.rank || 9) <= 6 ? 2.8 : 1.8, opacity: 1, lineCap: 'round', lineJoin: 'round' }) }).addTo(map);
        // Illustrative (dummy) Georgetown street map for the local view. It is a
        // design placeholder, not survey data: swap for a live tile provider in build.
        L.imageOverlay(CITY_MAP.src, CITY_MAP.bounds, { pane: 'gplCity', interactive: false }).addTo(map);
        CITY_MAP.areas.forEach(a => {
          L.marker([a.lat, a.lon], { pane: 'gplLabels', interactive: false, keyboard: false,
            icon: L.divIcon({ className: '', html: '<span class="city-label' + (a.water ? ' water' : '') + (a.park ? ' park' : '') + (a.t === a.t.toUpperCase() ? ' big' : '') + '">' + a.t + '</span>', iconSize: [0, 0] }) }).addTo(cityLabelLayer);
        });
        CITY_MAP.streets.forEach(s => {
          L.marker([s.lat, s.lon], { pane: 'gplLabels', interactive: false, keyboard: false,
            icon: L.divIcon({ className: '', html: '<span class="street-label" style="transform:translate(-50%,-50%) rotate(' + s.rot + 'deg)">' + s.t + '</span>', iconSize: [0, 0] }) }).addTo(streetLabelLayer);
        });
        syncCityLabels();
        (base.regions || []).forEach(r => {
          L.marker([r.properties.lat, r.properties.lon], { pane: 'gplLabels', interactive: false, keyboard: false,
            icon: L.divIcon({ className: '', html: '<span class="region-label">' + r.properties.name + '</span>', iconSize: [0, 0], iconAnchor: [0, 0] }) }).addTo(regionLabelLayer);
        });
        base.places.forEach(p => {
          const m = L.marker([p.lat, p.lon], { pane: 'gplLabels', interactive: false, keyboard: false,
            icon: L.divIcon({ className: '', html: '<span class="place-label' + (p.cap ? ' cap' : '') + '"><i></i>' + p.name + '</span>', iconSize: [0, 0], iconAnchor: [4, 4] }) });
          m._gplRank = p.rank;
          placeLayer.addLayer(m);
        });
        syncPlaces();
        const guyana = base.countries.find(f => f.properties.gy);
        if (!guyana) return;
        const rings = guyana.geometry.type === 'Polygon' ? guyana.geometry.coordinates : guyana.geometry.coordinates.flat();
        ZONES.forEach(z => {
          const shaped = rings.map(r => {
            let ring = r.slice();
            if (z.min > -180) ring = clipHalf(ring, z.min, false);
            if (ring.length && z.max < 180) ring = clipHalf(ring, z.max, true);
            return ring;
          }).filter(r => r.length > 2);
          if (!shaped.length) return;
          L.geoJSON({ type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: shaped } }, {
            style: { color: '#404293', weight: 1.6, opacity: 0.55, fillColor: '#404293', fillOpacity: 0.05, dashArray: '6 5' },
            interactive: false
          }).addTo(zoneLayer);
          L.marker(z.at, { interactive: false, icon: L.divIcon({ className: '', html: '<span class="zone-label">' + z.name + '</span>', iconSize: [90, 16], iconAnchor: [45, 8] }) }).addTo(zoneLayer);
        });
        syncZones();
      }).catch(() => {
        const st = document.getElementById('gplmap-stamp');
        if (st) st.textContent = 'Outage list loaded. The base map could not be loaded — check the connection.';
      });
    }

    function syncPlaces() {
      const z = map.getZoom();
      const maxRank = z >= 10 ? 99 : (z >= 8 ? 7 : 6);
      const city = L.latLngBounds(CITY_MAP.bounds);
      placeLayer.eachLayer(l => { const el = l.getElement(); if (el) el.style.display = (l._gplRank <= maxRank && !(z >= 12 && city.contains(l.getLatLng()))) ? '' : 'none'; });
    }
    map.on('zoomend', syncPlaces);

    function syncZones() {
      const show = map.getZoom() <= 9;
      zoneLayer.eachLayer(l => { if (l.setStyle) l.setStyle({ opacity: show ? 0.55 : 0, fillOpacity: show ? 0.05 : 0 }); });
    }
    map.on('zoomend', syncZones);

    const markers = {};
    OUTAGES.forEach(o => {
      const size = o.customers > 1500 ? 40 : (o.customers > 500 ? 34 : 28);
      const cls = 'pin ' + o.kind + (o.mine ? ' mine' : '');
      const glyph = o.kind === 'planned' ? '◷' : (o.kind === 'restored' ? '✓' : '⚡');
      const m = L.marker([o.lat, o.lon], {
        title: o.ref + ' — ' + o.place,
        icon: L.divIcon({ className: '', html: '<div class="' + cls + '" style="width:' + size + 'px;height:' + size + 'px;">' + glyph + '</div>', iconSize: [size, size], iconAnchor: [size / 2, size / 2] })
      }).addTo(map);
      m.on('click', () => { setActive(o.ref); openPanel(o); });
      markers[o.ref] = m;
    });

    function setActive(ref) {
      document.body.classList.toggle('map-has-selection', !!ref);
      Object.keys(markers).forEach(k => {
        const el = markers[k].getElement();
        const pin = el && el.querySelector('.pin');
        if (pin) pin.classList.toggle('active', k === ref);
      });
    }

    const panel = document.getElementById('gplmap-panel');
    function openPanel(o) {
      const labels = o.kind === 'planned' ? PLANNED_STAGES : STAGES;
      const tone = TONE[o.kind];
      document.getElementById('gplmap-p-eyebrow').textContent = (o.kind === 'planned' ? 'Planned interruption' : (o.kind === 'restored' ? 'Restored' : 'Unplanned outage')) + ' · ' + o.ref;
      document.getElementById('gplmap-p-title').textContent = o.title;
      document.getElementById('gplmap-p-zone').textContent = o.place + ' · ' + o.zone + ' · ' + o.feeder;
      document.getElementById('gplmap-p-cust').textContent = o.customers ? o.customers.toLocaleString('en-US') : 'None now';
      document.getElementById('gplmap-p-eta').textContent = o.eta;
      document.getElementById('gplmap-p-detail').textContent = o.detail;
      document.getElementById('gplmap-p-note').textContent = o.mine
        ? 'This is the outage affecting your address. You are one of ' + (o.reports || 1) + ' customers who have reported it.'
        : 'Customer counts come from GPL\u2019s feeder records and are indicative until the GIS layer is connected.';
      document.getElementById('gplmap-p-strip').innerHTML = labels.map((l, i) => {
        const done = i < o.stage, active = i === o.stage;
        return '<span class="gplmap-strip-step" style="padding-right:' + (i < labels.length - 1 ? '6px' : '0') + '">'
          + '<span class="gplmap-strip-bar" style="background:' + (done || active ? tone : 'rgba(19,28,46,0.12)') + '"></span>'
          + '<span class="gplmap-strip-label" style="color:' + (active ? tone : (done ? 'var(--fg-2)' : 'var(--fg-4)')) + '">' + l + '</span></span>';
      }).join('');
      panel.classList.add('open');
      requestAnimationFrame(() => {
        const panelH = panel.getBoundingClientRect().height;
        const zoom = map.getZoom();
        const targetPoint = map.project([o.lat, o.lon], zoom);
        // Marker should sit centered in the visible band above the panel, so the
        // new map center must be pushed down (in projected pixel space) by half
        // the panel's height relative to the marker.
        const newCenterPoint = L.point(targetPoint.x, targetPoint.y + panelH / 2);
        const newCenterLatLng = map.unproject(newCenterPoint, zoom);
        map.panTo(newCenterLatLng, { animate: true });
      });
    }
    document.getElementById('gplmap-p-close').addEventListener('click', () => { panel.classList.remove('open'); setActive(null); });
    map.on('click', () => { panel.classList.remove('open'); setActive(null); });

    const scopeBtn = document.getElementById('gplmap-scope');
    function syncScopeLabel() {
      const label = national ? 'Focus on my area' : 'View all Guyana outages';
      scopeBtn.setAttribute('aria-label', label);
      scopeBtn.setAttribute('title', label);
      scopeBtn.innerHTML = '<i data-lucide="' + (national ? 'locate-fixed' : 'map-pin') + '" style="width:18px;height:18px"></i>';
      if (window.lucide) { try { window.lucide.createIcons(); } catch (e) {} }
    }
    syncScopeLabel();
    scopeBtn.addEventListener('click', () => {
      national = !national;
      if (national) { map.fitBounds(NATIONAL_BOUNDS()); panel.classList.remove('open'); setActive(null); }
      else { showLocal(); setActive(MINE.ref); openPanel(MINE); }
      syncScopeLabel();
      setTimeout(() => map.invalidateSize(), 260);
    });

    const active = OUTAGES.filter(o => o.kind !== 'restored');
    document.getElementById('gplmap-count-active').textContent = active.length;
    document.getElementById('gplmap-count-cust').textContent = active.reduce((t, o) => t + o.customers, 0).toLocaleString('en-US');
    document.getElementById('gplmap-stamp').textContent = 'Last updated 16:05 today · ' + active.length + ' active, ' + (OUTAGES.length - active.length) + ' restored in the last 24 hours';

    if (!national) { setActive(MINE.ref); openPanel(MINE); }
    setTimeout(() => map.invalidateSize(), 100);
  }

  renderVals() {
    const national = new URLSearchParams(location.search).get('scope') === 'all';
    const inFrame = (() => { try { return window.parent && window.parent !== window; } catch (e) { return false; } })();
    return {
      zero: 0,
      headingText: national ? 'Outages across GPL' : 'Outages near you',
      onBack: () => {
        if (inFrame) { try { window.parent.postMessage({ type: 'gpl-outage-map-back' }, '*'); } catch (e) {} return; }
        try { window.dispatchEvent(new CustomEvent('gpl-goto-outages')); } catch (e) {}
        setTimeout(() => { try { window.location.href = 'GPL Outages and Faults.dc.html'; } catch (e) {} }, 50);
      }
    };
  }
}

</script>
